name: Remover aba Base de Dados do menu
on:
  push:
    paths:
      - '.github/workflows/ocultar-base-menu.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover apenas o botao do menu publico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          button='<button onclick="show(\'base\')">Base de Dados</button>'
          if button not in s:
              print('Botao nao encontrado ou ja removido; nenhum dado alterado')
          else:
              s=s.replace(button,'')
              p.write_text(s,encoding='utf-8')
              print('Botao removido; dados e outras secoes preservados')
          PY
      - name: Publicar alteracao no mesmo link
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Ocultar Base de Dados do menu publico"
            git push
          fi
