name: Alinhar cartao Geoprocessamento
on:
  push:
    paths:
      - '.github/workflows/alinhar-cartao-geoprocessamento.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alinhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir posicao do cartao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert 'geo-card-overlay-v1' in s, 'Cartao nao encontrado'
          old='position:absolute;left:77.2%;top:54.0%;width:13.1%;height:19.5%'
          new='position:absolute;left:72.9%;top:57.9%;width:12.9%;height:20.5%'
          assert old in s, 'CSS original nao encontrado'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Cartao reposicionado para cobrir o quarto bloco original')
          PY
      - name: Publicar correcao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Alinhar cartao Geoprocessamento ao quarto bloco"
          git push
